<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پنل مدیریت | 𝑪𝑨𝑷𝑰𝑻𝑨𝑵..-𝒗𝒆𝒙𝒐𝒓</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Vazirmatn', Tahoma, sans-serif; }
:root {
  --bg-dark: #0a0a0f;
  --cyan: #00ffe7;
  --purple: #a855f7;
  --pink: #ff2ec4;
  --text: #ffffff;
  --text-dim: #a0a0b0;
  --glass: rgba(255,255,255,0.04);
  --border: rgba(0,255,231,0.2);
  --danger: #ff3860;
  --success: #10b981;
}
body { background: var(--bg-dark); color: var(--text); min-height: 100vh; overflow-x: hidden; }
.bg-glow { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
.bg-glow::before, .bg-glow::after {
  content: ''; position: absolute; border-radius: 50%; filter: blur(120px); opacity: 0.4;
  animation: float 12s ease-in-out infinite;
}
.bg-glow::before { width: 500px; height: 500px; background: var(--cyan); top: -100px; right: -100px; }
.bg-glow::after { width: 600px; height: 600px; background: var(--purple); bottom: -150px; left: -150px; animation-delay: -6s; }
@keyframes float { 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(50px,50px) scale(1.1);} }

/* Login */
.login-screen { min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
.login-box {
  background: var(--glass); border: 1px solid var(--border); border-radius: 25px;
  padding: 45px 35px; backdrop-filter: blur(20px); width: 100%; max-width: 420px;
  text-align: center; box-shadow: 0 25px 60px rgba(0,255,231,0.1);
}
.login-icon { font-size: 4rem; margin-bottom: 15px; filter: drop-shadow(0 0 25px var(--cyan)); animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.05);} }
.login-box h1 {
  font-size: 1.5rem; margin-bottom: 8px;
  background: linear-gradient(90deg, var(--cyan), var(--purple));
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; font-weight: 900;
}
.login-box .subtitle { color: var(--text-dim); font-size: 0.9rem; margin-bottom: 30px; }
.input-group { position: relative; margin-bottom: 18px; }
.input-group input {
  width: 100%; padding: 15px 45px 15px 18px;
  background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 12px;
  color: var(--text); font-size: 1rem; outline: none; transition: 0.3s; font-family: inherit;
}
.input-group input:focus { border-color: var(--cyan); box-shadow: 0 0 20px rgba(0,255,231,0.3); }
.input-group .icon { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); font-size: 1.2rem; opacity: 0.6; }
.login-btn {
  width: 100%; padding: 15px; background: linear-gradient(90deg, var(--cyan), var(--purple));
  color: #0a0a0f; border: none; border-radius: 12px; font-size: 1rem; font-weight: 700;
  cursor: pointer; transition: 0.3s; font-family: inherit; margin-top: 10px; box-shadow: 0 0 25px rgba(0,255,231,0.4);
}
.login-btn:hover { transform: translateY(-2px); box-shadow: 0 0 40px rgba(0,255,231,0.7); }
.error-msg {
  background: rgba(255,56,96,0.15); border: 1px solid var(--danger); color: var(--danger);
  padding: 12px; border-radius: 10px; margin-top: 15px; font-size: 0.9rem; display: none;
}
.error-msg.show { display: block; animation: shake 0.4s; }
@keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-8px);} 75%{transform:translateX(8px);} }
.back-link { display: inline-block; margin-top: 20px; color: var(--text-dim); text-decoration: none; font-size: 0.85rem; }
.back-link:hover { color: var(--cyan); }

/* Dashboard */
.dashboard { display: none; padding: 20px; max-width: 1000px; margin: 0 auto; }
.dashboard.active { display: block; animation: fadeIn 0.5s; }
@keyframes fadeIn { from{opacity:0;} to{opacity:1;} }
.dash-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 20px; background: var(--glass); border: 1px solid var(--border);
  border-radius: 18px; margin-bottom: 25px; backdrop-filter: blur(20px);
  flex-wrap: wrap; gap: 15px;
}
.dash-header h1 {
  font-size: 1.3rem; background: linear-gradient(90deg, var(--cyan), var(--purple));
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; font-weight: 900;
}
.logout-btn {
  padding: 10px 20px; background: rgba(255,56,96,0.15); border: 1px solid var(--danger);
  color: var(--danger); border-radius: 10px; cursor: pointer; font-family: inherit;
  font-weight: 600; transition: 0.3s; font-size: 0.85rem;
}
.logout-btn:hover { background: var(--danger); color: white; }

/* Tabs */
.tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
.tab {
  padding: 12px 22px; background: var(--glass); border: 1px solid var(--border);
  border-radius: 12px; cursor: pointer; transition: 0.3s; font-family: inherit;
  color: var(--text-dim); font-weight: 600; font-size: 0.9rem;
}
.tab:hover { color: var(--cyan); border-color: var(--cyan); }
.tab.active {
  background: linear-gradient(135deg, rgba(0,255,231,0.15), rgba(168,85,247,0.15));
  color: var(--cyan); border-color: var(--cyan); box-shadow: 0 0 20px rgba(0,255,231,0.2);
}
.tab-content { display: none; }
.tab-content.active { display: block; animation: fadeIn 0.3s; }

/* Card */
.card {
  background: var(--glass); border: 1px solid var(--border); border-radius: 20px;
  padding: 25px; backdrop-filter: blur(20px); margin-bottom: 20px;
}
.card-title {
  font-size: 1.1rem; font-weight: 700; color: var(--cyan);
  margin-bottom: 20px; display: flex; align-items: center; gap: 10px;
}
.form-group { margin-bottom: 15px; }
.form-group label {
  display: block; font-size: 0.85rem; color: var(--text-dim);
  margin-bottom: 6px; font-weight: 600;
}
.form-group input, .form-group textarea, .form-group select {
  width: 100%; padding: 13px 16px; background: rgba(0,0,0,0.3);
  border: 1px solid var(--border); border-radius: 10px;
  color: var(--text); font-size: 0.95rem; outline: none; transition: 0.3s; font-family: inherit;
}
.form-group input:focus, .form-group textarea:focus, .form-group select:focus {
  border-color: var(--cyan); box-shadow: 0 0 15px rgba(0,255,231,0.2);
}
.form-group .hint { font-size: 0.75rem; color: #666; margin-top: 5px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
.form-row.full { grid-template-columns: 1fr; }

.save-btn {
  width: 100%; padding: 14px; background: linear-gradient(90deg, var(--cyan), var(--purple));
  color: #0a0a0f; border: none; border-radius: 12px; font-size: 1rem; font-weight: 700;
  cursor: pointer; transition: 0.3s; font-family: inherit; box-shadow: 0 0 25px rgba(0,255,231,0.4);
  display: flex; align-items: center; justify-content: center; gap: 10px;
}
.save-btn:hover { transform: translateY(-2px); box-shadow: 0 0 40px rgba(0,255,231,0.7); }
.save-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

/* Status */
.status {
  padding: 15px 20px; border-radius: 12px; margin-bottom: 20px;
  font-weight: 600; display: none; align-items: center; gap: 10px;
}
.status.show { display: flex; animation: slideUp 0.4s; }
@keyframes slideUp { from{opacity:0;transform:translateY(-10px);} to{opacity:1;transform:translateY(0);} }
.status.success { background: rgba(16,185,129,0.15); border: 1px solid var(--success); color: var(--success); }
.status.error { background: rgba(255,56,96,0.15); border: 1px solid var(--danger); color: var(--danger); }
.status.loading { background: rgba(0,255,231,0.1); border: 1px solid var(--cyan); color: var(--cyan); }

/* Products List */
.products-list { display: grid; gap: 12px; }
.product-item {
  background: rgba(0,0,0,0.3); border: 1px solid var(--border);
  border-radius: 12px; padding: 15px;
  display: flex; justify-content: space-between; align-items: center;
  gap: 15px; flex-wrap: wrap; transition: 0.3s;
}
.product-item:hover { border-color: var(--cyan); }
.product-info { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 200px; }
.product-thumb {
  width: 60px; height: 60px; border-radius: 10px; object-fit: cover;
  border: 1px solid var(--border);
}
.product-emoji { font-size: 2rem; }
.product-details h4 { font-size: 1rem; margin-bottom: 3px; }
.product-details p { font-size: 0.8rem; color: var(--text-dim); }
.product-price { color: var(--cyan); font-weight: 700; font-size: 0.9rem; margin: 0 10px; }
.btn-icon {
  width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--border);
  background: transparent; color: var(--text); cursor: pointer; transition: 0.3s;
  font-size: 1rem; display: flex; align-items: center; justify-content: center;
}
.btn-icon:hover { background: rgba(0,255,231,0.1); border-color: var(--cyan); }
.btn-icon.danger:hover { background: rgba(255,56,96,0.15); border-color: var(--danger); color: var(--danger); }

.empty-state { text-align: center; padding: 40px 20px; color: var(--text-dim); }
.empty-state .icon { font-size: 3rem; margin-bottom: 10px; opacity: 0.5; }

.info-box {
  background: rgba(0,255,231,0.05); border: 1px solid rgba(0,255,231,0.2);
  border-radius: 12px; padding: 15px 18px; margin-bottom: 20px;
  font-size: 0.85rem; color: var(--text-dim); line-height: 1.8;
}
.info-box strong { color: var(--cyan); }

@media (max-width: 600px) {
  .login-box { padding: 35px 25px; }
  .card { padding: 18px; }
  .form-row { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="bg-glow"></div>

<!-- Login -->
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <div class="login-icon">🔐</div>
    <h1>𝑪𝑨𝑷𝑰𝑻𝑨𝑵..-𝒗𝒆𝒙𝒐𝒓</h1>
    <p class="subtitle">ورود به پنل مدیریت</p>
    <div class="input-group">
      <span class="icon">👤</span>
      <input type="text" id="username" placeholder="نام کاربری">
    </div>
    <div class="input-group">
      <span class="icon">🔑</span>
      <input type="password" id="password" placeholder="رمز عبور">
    </div>
    <button class="login-btn" onclick="login()">🚀 ورود به پنل</button>
    <div class="error-msg" id="errorMsg">❌ نام کاربری یا رمز عبور اشتباه است!</div>
    <a href="../" class="back-link">← بازگشت به سایت</a>
  </div>
</div>

<!-- Dashboard -->
<div class="dashboard" id="dashboard">
  <div class="dash-header">
    <h1>⚓ پنل مدیریت کاپیتان وکتور</h1>
    <button class="logout-btn" onclick="logout()">🚪 خروج</button>
  </div>

  <div id="statusBox" class="status"></div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('products', this)">📦 محصولات</button>
    <button class="tab" onclick="switchTab('contact', this)">📞 اطلاعات تماس</button>
  </div>

  <!-- Tab: Products -->
  <div class="tab-content active" id="tab-products">
    <div class="card">
      <div class="card-title">➕ افزودن محصول جدید</div>
      <div class="info-box">
        💡 <strong>عکس محصول</strong> رو قبلاً توی گیت‌هاب آپلود کن. اسم فایلش رو دقیقاً اینجا بنویس (مثلاً <strong>call-of-duty.jpg</strong>)
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>اسم محصول *</label>
          <input type="text" id="pName" placeholder="مثلاً: اکانت کلش TH15">
        </div>
        <div class="form-group">
          <label>دسته‌بندی *</label>
          <select id="pCategory">
            <option value="کالاف">کالاف</option>
            <option value="کلش">کلش</option>
            <option value="آیتم کلش">آیتم کلش</option>
            <option value="آیتم کالاف">آیتم کالاف</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>قیمت</label>
          <input type="text" id="pPrice" placeholder="مثلاً: 500000 یا تماس بگیرید">
        </div>
        <div class="form-group">
          <label>ایموجی (اختیاری)</label>
          <input type="text" id="pEmoji" placeholder="🎯" value="🎯">
        </div>
      </div>

      <div class="form-group">
        <label>اسم فایل عکس (توی گیت‌هاب آپلود شده)</label>
        <input type="text" id="pImage" placeholder="مثلاً: clash-of-clans.jpg" dir="ltr">
      </div>

      <div class="form-group">
        <label>توضیحات</label>
        <textarea id="pDesc" rows="2" placeholder="توضیحات کوتاه..."></textarea>
      </div>

      <button class="save-btn" onclick="addProduct()">➕ افزودن محصول</button>
    </div>

    <div class="card">
      <div class="card-title">📦 لیست محصولات</div>
      <div class="products-list" id="productsList"></div>
    </div>
  </div>

  <!-- Tab: Contact -->
  <div class="tab-content" id="tab-contact">
    <div class="card">
      <div class="card-title">📞 اطلاعات تماس</div>
      <div class="form-group">
        <label>📱 شماره تماس</label>
        <input type="text" id="phone" placeholder="09388499513" dir="ltr">
      </div>
      <div class="form-group">
        <label>💬 آیدی روبیکا (بدون @)</label>
        <input type="text" id="rubika" placeholder="oooo1219" dir="ltr">
      </div>
      <button class="save-btn" onclick="saveSettings()">💾 ذخیره اطلاعات تماس</button>
    </div>
  </div>
</div>

<script>
// ==== تنظیمات Supabase ====
const SUPABASE_URL = 'https://pvghoflyhkppgpralypc.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB2Z2hvZmx5aGtwcGdwcmFseXBjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzMjcwODIsImV4cCI6MjEwNTkwMzA4Mn0.yaYfCSXUegLwB3AQDuj733xyCZK49J95W2Gey6EAiWw';

const DEFAULT_USERNAME = 'admin';
const DEFAULT_PASSWORD = 'vexor2024';

// ==== Login ====
function login() {
  const user = document.getElementById('username').value.trim();
  const pass = document.getElementById('password').value.trim();
  const savedUser = localStorage.getItem('cv_username') || DEFAULT_USERNAME;
  const savedPass = localStorage.getItem('cv_password') || DEFAULT_PASSWORD;

  if (user === savedUser && pass === savedPass) {
    sessionStorage.setItem('cv_logged_in', 'true');
    showDashboard();
  } else {
    document.getElementById('errorMsg').classList.add('show');
    setTimeout(() => document.getElementById('errorMsg').classList.remove('show'), 3000);
  }
}

document.getElementById('password').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') login();
});

function showDashboard() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('dashboard').classList.add('active');
  loadProducts();
  loadSettings();
}

function logout() {
  sessionStorage.removeItem('cv_logged_in');
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('dashboard').classList.remove('active');
}

window.addEventListener('load', () => {
  if (sessionStorage.getItem('cv_logged_in') === 'true') showDashboard();
});

// ==== Tabs ====
function switchTab(tabName, btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-' + tabName).classList.add('active');
}

// ==== Status ====
function showStatus(msg, type = 'loading') {
  const box = document.getElementById('statusBox');
  box.className = 'status show ' + type;
  box.textContent = msg;
  if (type !== 'loading') {
    setTimeout(() => box.classList.remove('show'), 4000);
  }
}

// ==== Products ====
async function loadProducts() {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/products?select=*&order=id.asc`, {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
    });
    const products = await res.json();
    renderProducts(products);
  } catch (err) {
    showStatus('❌ خطا در بارگذاری محصولات: ' + err.message, 'error');
  }
}

function renderProducts(products) {
  const list = document.getElementById('productsList');
  if (!products || products.length === 0) {
    list.innerHTML = `<div class="empty-state"><div class="icon">📦</div><p>هنوز محصولی اضافه نکردی!</p></div>`;
    return;
  }
  list.innerHTML = products.map(p => `
    <div class="product-item">
      <div class="product-info">
        ${p.image_url ? `<img src="../${p.image_url}" class="product-thumb" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">` : ''}
        <div class="product-emoji" style="${p.image_url ? 'display:none' : ''}">${p.emoji || '🎯'}</div>
        <div class="product-details">
          <h4>${p.name}</h4>
          <p>${p.category} — ${p.description || 'بدون توضیحات'}</p>
        </div>
      </div>
      <div class="product-price">${p.price || 'تماس'}</div>
      <button class="btn-icon danger" onclick="deleteProduct(${p.id})" title="حذف">🗑️</button>
    </div>
  `).join('');
}

async function addProduct() {
  const name = document.getElementById('pName').value.trim();
  const category = document.getElementById('pCategory').value;
  const price = document.getElementById('pPrice').value.trim();
  const emoji = document.getElementById('pEmoji').value.trim() || '🎯';
  const image = document.getElementById('pImage').value.trim();
  const desc = document.getElementById('pDesc').value.trim();

  if (!name) {
    showStatus('❌ اسم محصول رو بنویس!', 'error');
    return;
  }

  showStatus('⏳ در حال ذخیره...', 'loading');

  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/products`, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Content-Type': 'application/json',
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify({
        name: name,
        category: category,
        price: price || 'تماس بگیرید',
        description: desc,
        image_url: image,
        emoji: emoji
      })
    });

    if (res.ok) {
      showStatus('🎉 محصول اضافه شد!', 'success');
      document.getElementById('pName').value = '';
      document.getElementById('pPrice').value = '';
      document.getElementById('pImage').value = '';
      document.getElementById('pDesc').value = '';
      loadProducts();
    } else {
      const err = await res.text();
      showStatus('❌ خطا: ' + err, 'error');
    }
  } catch (err) {
    showStatus('❌ خطا: ' + err.message, 'error');
  }
}

async function deleteProduct(id) {
  if (!confirm('مطمئنی می‌خوای این محصول رو حذف کنی؟')) return;

  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/products?id=eq.${id}`, {
      method: 'DELETE',
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
    });

    if (res.ok) {
      showStatus('🗑️ محصول حذف شد', 'success');
      loadProducts();
    } else {
      showStatus('❌ خطا در حذف', 'error');
    }
  } catch (err) {
    showStatus('❌ خطا: ' + err.message, 'error');
  }
}

// ==== Settings ====
async function loadSettings() {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/shop_settings?id=eq.1&select=*`, {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
    });
    const data = await res.json();
    if (data && data.length > 0) {
      document.getElementById('phone').value = data[0].phone || '';
      document.getElementById('rubika').value = data[0].rubika_id || '';
    }
  } catch (err) {
    console.error(err);
  }
}

async function saveSettings() {
  const phone = document.getElementById('phone').value.trim();
  const rubika = document.getElementById('rubika').value.trim();

  if (!phone || !rubika) {
    showStatus('❌ شماره و آیدی رو کامل وارد کن!', 'error');
    return;
  }

  showStatus('⏳ در حال ذخیره...', 'loading');

  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/shop_settings?id=eq.1`, {
      method: 'PATCH',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ phone, rubika_id: rubika, updated_at: new Date().toISOString() })
    });

    if (res.ok) {
      showStatus('🎉 ذخیره شد! سایت آپدیت شد', 'success');
    } else {
      showStatus('❌ خطا در ذخیره', 'error');
    }
  } catch (err) {
    showStatus('❌ خطا: ' + err.message, 'error');
  }
}
</script>
