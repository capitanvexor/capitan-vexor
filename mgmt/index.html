<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پنل مدیریت | 𝑪𝑨𝑷𝑰𝑻𝑨𝑵..-𝒗𝒆𝒙𝒐𝒓</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Vazirmatn', Tahoma, sans-serif; }
:root {
  --bg-dark: #0a0a0f;
  --cyan: #00ffe7;
  --purple: #a855f7;
  --pink: #ff2ec4;
  --text: #ffffff;
  --text-dim: #a0a0b0;
  --glass: rgba(255,255,255,0.04);
  --border: rgba(0,255,231,0.2);
  --danger: #ff3860;
  --success: #10b981;
  --warning: #f59e0b;
}
body { background: var(--bg-dark); color: var(--text); min-height: 100vh; overflow-x: hidden; }
.bg-glow { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
.bg-glow::before, .bg-glow::after {
  content: ''; position: absolute; border-radius: 50%; filter: blur(120px); opacity: 0.4;
  animation: float 12s ease-in-out infinite;
}
.bg-glow::before { width: 500px; height: 500px; background: var(--cyan); top: -100px; right: -100px; }
.bg-glow::after { width: 600px; height: 600px; background: var(--purple); bottom: -150px; left: -150px; animation-delay: -6s; }
@keyframes float { 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(50px,50px) scale(1.1);} }

.login-screen { min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
.login-box {
  background: var(--glass); border: 1px solid var(--border); border-radius: 25px;
  padding: 45px 35px; backdrop-filter: blur(20px); width: 100%; max-width: 420px;
  text-align: center; box-shadow: 0 25px 60px rgba(0,255,231,0.1);
}
.login-icon { font-size: 4rem; margin-bottom: 15px; filter: drop-shadow(0 0 25px var(--cyan)); animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.05);} }
.login-box h1 {
  font-size: 1.5rem; margin-bottom: 8px;
  background: linear-gradient(90deg, var(--cyan), var(--purple));
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; font-weight: 900;
}
.login-box .subtitle { color: var(--text-dim); font-size: 0.9rem; margin-bottom: 30px; }
.input-group { position: relative; margin-bottom: 18px; }
.input-group input {
  width: 100%; padding: 15px 45px 15px 18px;
  background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 12px;
  color: var(--text); font-size: 1rem; outline: none; transition: 0.3s; font-family: inherit;
}
.input-group input:focus { border-color: var(--cyan); box-shadow: 0 0 20px rgba(0,255,231,0.3); }
.input-group .icon { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); font-size: 1.2rem; opacity: 0.6; }
.login-btn {
  width: 100%; padding: 15px; background: linear-gradient(90deg, var(--cyan), var(--purple));
  color: #0a0a0f; border: none; border-radius: 12px; font-size: 1rem; font-weight: 700;
  cursor: pointer; transition: 0.3s; font-family: inherit; margin-top: 10px; box-shadow: 0 0 25px rgba(0,255,231,0.4);
}
.login-btn:hover { transform: translateY(-2px); box-shadow: 0 0 40px rgba(0,255,231,0.7); }
.error-msg { background: rgba(255,56,96,0.15); border: 1px solid var(--danger); color: var(--danger); padding: 12px; border-radius: 10px; margin-top: 15px; font-size: 0.9rem; display: none; }
.error-msg.show { display: block; }
.back-link { display: inline-block; margin-top: 20px; color: var(--text-dim); text-decoration: none; font-size: 0.85rem; }
.back-link:hover { color: var(--cyan); }

.dashboard { display: none; padding: 20px; max-width: 1000px; margin: 0 auto; }
.dashboard.active { display: block; }
.dash-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 20px; background: var(--glass); border: 1px solid var(--border);
  border-radius: 18px; margin-bottom: 25px; backdrop-filter: blur(20px);
  flex-wrap: wrap; gap: 15px;
}
.dash-header h1 {
  font-size: 1.3rem; background: linear-gradient(90deg, var(--cyan), var(--purple));
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; font-weight: 900;
}
.logout-btn {
  padding: 10px 20px; background: rgba(255,56,96,0.15); border: 1px solid var(--danger);
  color: var(--danger); border-radius: 10px; cursor: pointer; font-family: inherit;
  font-weight: 600; transition: 0.3s; font-size: 0.85rem;
}
.logout-btn:hover { background: var(--danger); color: white; }

.tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
.tab {
  padding: 12px 22px; background: var(--glass); border: 1px solid var(--border);
  border-radius: 12px; cursor: pointer; transition: 0.3s; font-family: inherit;
  color: var(--text-dim); font-weight: 600; font-size: 0.9rem;
}
.tab:hover { color: var(--cyan); border-color: var(--cyan); }
.tab.active {
  background: linear-gradient(135deg, rgba(0,255,231,0.15), rgba(168,85,247,0.15));
  color: var(--cyan); border-color: var(--cyan);
}
.tab-content { display: none; }
.tab-content.active { display: block; }

.card {
  background: var(--glass); border: 1px solid var(--border); border-radius: 20px;
  padding: 25px; backdrop-filter: blur(20px); margin-bottom: 20px;
}
.card-title {
  font-size: 1.1rem; font-weight: 700; color: var(--cyan);
  margin-bottom: 20px; display: flex; align-items: center; gap: 10px;
}
.form-group { margin-bottom: 15px; }
.form-group label {
  display: block; font-size: 0.85rem; color: var(--text-dim);
  margin-bottom: 6px; font-weight: 600;
}
.form-group input, .form-group textarea, .form-group select {
  width: 100%; padding: 13px 16px; background: rgba(0,0,0,0.3);
  border: 1px solid var(--border); border-radius: 10px;
  color: var(--text); font-size: 0.95rem; outline: none; transition: 0.3s; font-family: inherit;
}
.form-group input:focus, .form-group textarea:focus, .form-group select:focus {
  border-color: var(--cyan); box-shadow: 0 0 15px rgba(0,255,231,0.2);
}
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
.form-row.three { grid-template-columns: 1fr 1fr 1fr; }

.save-btn {
  width: 100%; padding: 14px; background: linear-gradient(90deg, var(--cyan), var(--purple));
  color: #0a0a0f; border: none; border-radius: 12px; font-size: 1rem; font-weight: 700;
  cursor: pointer; transition: 0.3s; font-family: inherit; box-shadow: 0 0 25px rgba(0,255,231,0.4);
}
.save-btn:hover { transform: translateY(-2px); box-shadow: 0 0 40px rgba(0,255,231,0.7); }
.save-btn:disabled { opacity: 0.6; cursor: not-allowed; }

.upload-area {
  border: 2px dashed var(--border); border-radius: 12px; padding: 30px 20px;
  text-align: center; cursor: pointer; transition: 0.3s; background: rgba(0,0,0,0.2);
}
.upload-area:hover { border-color: var(--cyan); background: rgba(0,255,231,0.05); }
.upload-area .icon { font-size: 3rem; margin-bottom: 10px; }
.upload-area p { color: var(--text-dim); font-size: 0.9rem; }
.upload-area input { display: none; }
.images-preview { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 15px; }
.img-preview-item {
  position: relative; width: 80px; height: 80px; border-radius: 10px;
  overflow: hidden; border: 2px solid var(--border);
}
.img-preview-item img { width: 100%; height: 100%; object-fit: cover; }
.img-preview-item .remove {
  position: absolute; top: 3px; right: 3px; background: rgba(255,56,96,0.9);
  color: white; border: none; border-radius: 50%; width: 22px; height: 22px;
  cursor: pointer; font-size: 0.8rem; display: flex; align-items: center; justify-content: center;
}

.status {
  padding: 15px 20px; border-radius: 12px; margin-bottom: 20px;
  font-weight: 600; display: none; align-items: center; gap: 10px;
}
.status.show { display: flex; }
.status.success { background: rgba(16,185,129,0.15); border: 1px solid var(--success); color: var(--success); }
.status.error { background: rgba(255,56,96,0.15); border: 1px solid var(--danger); color: var(--danger); }
.status.loading { background: rgba(0,255,231,0.1); border: 1px solid var(--cyan); color: var(--cyan); }

.products-list { display: grid; gap: 12px; }
.product-item {
  background: rgba(0,0,0,0.3); border: 1px solid var(--border);
  border-radius: 12px; padding: 15px;
  display: flex; justify-content: space-between; align-items: center;
  gap: 15px; flex-wrap: wrap; transition: 0.3s;
}
.product-item:hover { border-color: var(--cyan); }
.product-thumb {
  width: 60px; height: 60px; border-radius: 10px; object-fit: cover;
  border: 1px solid var(--border);
}
.product-details h4 { font-size: 1rem; margin-bottom: 3px; }
.product-details p { font-size: 0.8rem; color: var(--text-dim); }
.product-price { color: var(--cyan); font-weight: 700; font-size: 0.9rem; }
.product-actions { display: flex; gap: 8px; }
.btn-icon {
  width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--border);
  background: transparent; color: var(--text); cursor: pointer; transition: 0.3s;
  font-size: 1rem; display: flex; align-items: center; justify-content: center;
}
.btn-icon:hover { background: rgba(0,255,231,0.1); border-color: var(--cyan); }
.btn-icon.danger:hover { background: rgba(255,56,96,0.15); border-color: var(--danger); color: var(--danger); }

/* Status Badge */
.status-badge {
  padding: 5px 12px; border-radius: 50px; font-size: 0.75rem; font-weight: 700;
  cursor: pointer; transition: 0.3s; border: 1px solid;
  display: inline-flex; align-items: center; gap: 5px;
}
.status-badge.available { background: rgba(16,185,129,0.15); color: var(--success); border-color: var(--success); }
.status-badge.sold { background: rgba(255,56,96,0.15); color: var(--danger); border-color: var(--danger); }
.status-badge.unavailable { background: rgba(100,100,100,0.15); color: #999; border-color: #666; }
.status-badge:hover { transform: scale(1.05); }

.empty-state { text-align: center; padding: 40px 20px; color: var(--text-dim); }
.empty-state .icon { font-size: 3rem; margin-bottom: 10px; opacity: 0.5; }

/* Modal */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.8);
  backdrop-filter: blur(10px); z-index: 99999;
  display: none; justify-content: center; align-items: center; padding: 20px;
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--bg-dark); border: 1px solid var(--border);
  border-radius: 25px; padding: 30px; width: 100%; max-width: 600px;
  max-height: 90vh; overflow-y: auto; animation: modalIn 0.3s ease-out;
  box-shadow: 0 25px 60px rgba(0,255,231,0.2);
}
@keyframes modalIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
.modal-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px solid var(--border);
}
.modal-header h2 {
  font-size: 1.3rem; background: linear-gradient(90deg, var(--cyan), var(--purple));
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  font-weight: 900;
}
.modal-close {
  background: transparent; border: none; color: var(--text-dim);
  font-size: 1.5rem; cursor: pointer; width: 35px; height: 35px;
  border-radius: 10px; transition: 0.3s;
}
.modal-close:hover { background: rgba(255,56,96,0.15); color: var(--danger); }
.modal-actions {
  display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap;
}
.modal-btn {
  flex: 1; padding: 13px; border-radius: 12px; border: none;
  font-family: inherit; font-weight: 700; font-size: 0.95rem;
  cursor: pointer; transition: 0.3s; min-width: 120px;
}
.modal-btn.primary {
  background: linear-gradient(90deg, var(--cyan), var(--purple));
  color: #0a0a0f; box-shadow: 0 0 20px rgba(0,255,231,0.4);
}
.modal-btn.primary:hover { transform: translateY(-2px); box-shadow: 0 0 30px rgba(0,255,231,0.7); }
.modal-btn.secondary {
  background: rgba(255,255,255,0.05); color: var(--text); border: 1px solid var(--border);
}
.modal-btn.secondary:hover { border-color: var(--cyan); color: var(--cyan); }

/* Image grid in modal */
.existing-images {
  display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px;
}
.existing-img-item {
  position: relative; width: 80px; height: 80px; border-radius: 10px;
  overflow: hidden; border: 2px solid var(--border);
}
.existing-img-item img { width: 100%; height: 100%; object-fit: cover; }
.existing-img-item .delete-img {
  position: absolute; top: 3px; right: 3px;
  background: rgba(255,56,96,0.9); color: white; border: none;
  border-radius: 50%; width: 22px; height: 22px; cursor: pointer;
  font-size: 0.8rem; display: flex; align-items: center; justify-content: center;
}

@media (max-width: 600px) {
  .login-box { padding: 35px 25px; }
  .card { padding: 18px; }
  .form-row, .form-row.three { grid-template-columns: 1fr; }
  .modal { padding: 20px; }
}
</style>
</head>
<body>

<div class="bg-glow"></div>

<!-- Login -->
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <div class="login-icon">🔐</div>
    <h1>𝑪𝑨𝑷𝑰𝑻𝑨𝑵..-𝒗𝒆𝒙𝒐𝒓</h1>
    <p class="subtitle">ورود به پنل مدیریت</p>
    <div class="input-group">
      <span class="icon">👤</span>
      <input type="text" id="username" placeholder="نام کاربری">
    </div>
    <div class="input-group">
      <span class="icon">🔑</span>
      <input type="password" id="password" placeholder="رمز عبور">
    </div>
    <button class="login-btn" onclick="login()">🚀 ورود به پنل</button>
    <div class="error-msg" id="errorMsg">❌ نام کاربری یا رمز عبور اشتباه است!</div>
    <a href="../" class="back-link">← بازگشت به سایت</a>
  </div>
</div>

<!-- Dashboard -->
<div class="dashboard" id="dashboard">
  <div class="dash-header">
    <h1>⚓ پنل مدیریت کاپیتان وکتور</h1>
    <button class="logout-btn" onclick="logout()">🚪 خروج</button>
  </div>

  <div id="statusBox" class="status"></div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('add', this)">➕ افزودن</button>
    <button class="tab" onclick="switchTab('list', this)">📦 لیست محصولات</button>
    <button class="tab" onclick="switchTab('contact', this)">📞 تماس</button>
  </div>

  <!-- Tab: Add -->
  <div class="tab-content active" id="tab-add">
    <div class="card">
      <div class="card-title">➕ افزودن محصول جدید</div>

      <div class="form-group">
        <label>🎮 عنوان *</label>
        <input type="text" id="pTitle" placeholder="مثلاً: اکانت کلش TH14 پر مانع">
      </div>

      <div class="form-group">
        <label>💬 شعار (اختیاری)</label>
        <input type="text" id="pSlogan" placeholder="🔥 نقد و اقساط تضمینی">
      </div>

      <div class="form-group">
        <label>📂 دسته‌بندی *</label>
        <select id="pCategory" onchange="updateCategoryFields()">
          <option value="کلش">🏰 کلش</option>
          <option value="کالاف">🎯 کالاف</option>
          <option value="آیتم کلش">💎 آیتم کلش</option>
          <option value="آیتم کالاف">🔫 آیتم کالاف</option>
        </select>
      </div>

      <div id="fields-clash" class="form-row three">
        <div class="form-group">
          <label>🏰 تاون هال</label>
          <input type="number" id="pTownHall" placeholder="14">
        </div>
        <div class="form-group">
          <label>🏗️ لول بیلدر</label>
          <input type="number" id="pBuilder" placeholder="10">
        </div>
        <div class="form-group">
          <label>✏️ تغییر نام</label>
          <input type="number" id="pNameChanges" placeholder="1">
        </div>
      </div>

      <div id="fields-cod" class="form-row three" style="display:none;">
        <div class="form-group">
          <label>🎖️ رنک</label>
          <input type="text" id="pRank" placeholder="Legendary">
        </div>
        <div class="form-group">
          <label>📊 لول پلیر</label>
          <input type="number" id="pPlayerLevel" placeholder="150">
        </div>
        <div class="form-group">
          <label>🎨 تعداد اسکین</label>
          <input type="number" id="pSkins" placeholder="50">
        </div>
      </div>

      <div id="fields-item" class="form-row" style="display:none;">
        <div class="form-group">
          <label>🏷️ نوع آیتم</label>
          <input type="text" id="pItemType" placeholder="بلیط طلایی">
        </div>
        <div class="form-group">
          <label>📦 مقدار</label>
          <input type="text" id="pItemAmount" placeholder="۱ عدد">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>🆔 کد محصول</label>
          <input type="text" id="pCode" placeholder="232" dir="ltr">
        </div>
        <div class="form-group">
          <label>💰 قیمت (تومان) *</label>
          <input type="number" id="pPrice" placeholder="5800000">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>💵 قیمت دلاری</label>
          <input type="text" id="pPriceUsd" placeholder="95$" dir="ltr">
        </div>
        <div class="form-group">
          <label>✅ وضعیت</label>
          <select id="pStatus">
            <option value="موجود">✅ موجود</option>
            <option value="ناموجود">❌ ناموجود</option>
            <option value="فروش رفته">🔴 فروش رفته</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>📝 توضیحات</label>
        <textarea id="pDesc" rows="3" placeholder="توضیحات کامل..."></textarea>
      </div>

      <div class="form-group">
        <label>📸 عکس‌ها (چندتایی — خودکار فشرده میشن)</label>
        <div class="upload-area" onclick="document.getElementById('pImages').click()">
          <div class="icon">🖼️</div>
          <p>برای انتخاب عکس‌ها کلیک کن</p>
          <p style="font-size:0.75rem;color:#666;margin-top:5px;">⚡ عکس‌ها خودکار فشرده میشن</p>
          <input type="file" id="pImages" accept="image/*" multiple onchange="handleImages(event)">
        </div>
        <div class="images-preview" id="imagesPreview"></div>
      </div>

      <button class="save-btn" id="addBtn" onclick="addProduct()">🚀 ثبت محصول</button>
    </div>
  </div>

  <!-- Tab: List -->
  <div class="tab-content" id="tab-list">
    <div class="card">
      <div class="card-title">📦 لیست محصولات</div>
      <div style="margin-bottom: 15px; display: flex; gap: 8px; flex-wrap: wrap;">
        <button class="status-badge available" onclick="filterList('all')">همه</button>
        <button class="status-badge available" onclick="filterList('موجود')">✅ موجود</button>
        <button class="status-badge unavailable" onclick="filterList('ناموجود')">❌ ناموجود</button>
        <button class="status-badge sold" onclick="filterList('فروش رفته')">🔴 فروش رفته</button>
      </div>
      <div class="products-list" id="productsList"></div>
    </div>
  </div>

  <!-- Tab: Contact -->
  <div class="tab-content" id="tab-contact">
    <div class="card">
      <div class="card-title">📞 اطلاعات تماس</div>
      <div class="form-group">
        <label>📱 شماره تماس</label>
        <input type="text" id="phone" placeholder="09388499513" dir="ltr">
      </div>
      <div class="form-group">
        <label>💬 آیدی روبیکا</label>
        <input type="text" id="rubika" placeholder="oooo1219" dir="ltr">
      </div>
      <button class="save-btn" onclick="saveSettings()">💾 ذخیره</button>
    </div>
  </div>
</div>

<!-- Edit Modal -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <div class="modal-header">
      <h2>✏️ ویرایش محصول</h2>
      <button class="modal-close" onclick="closeEditModal()">✕</button>
    </div>

    <input type="hidden" id="editId">
    <input type="hidden" id="editImages" value="[]">

    <div class="form-group">
      <label>🎮 عنوان *</label>
      <input type="text" id="editTitle">
    </div>

    <div class="form-group">
      <label>💬 شعار</label>
      <input type="text" id="editSlogan">
    </div>

    <div class="form-group">
      <label>📂 دسته‌بندی</label>
      <select id="editCategory">
        <option value="کلش">🏰 کلش</option>
        <option value="کالاف">🎯 کالاف</option>
        <option value="آیتم کلش">💎 آیتم کلش</option>

        <label>✅ وضعیت</label>

          <option value="موجود">✅ موجود</option>

        <div class="icon">🖼️</div>

        <input type="file" id="editImagesInput" accept="image/*" multiple onchange="handleEditImages(event)">

<script>
const SUPABASE_URL = 'https://pvghoflyhkppgpralypc.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB2Z2hvZmx5aGtwcGdwcmFseXBjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzMjcwODIsImV4cCI6MjEwNTkwMzA4Mn0.yaYfCSXUegLwB3AQDuj733xyCZK49J95W2Gey6EAiWw';

const DEFAULT_USERNAME = 'admin';
const DEFAULT_PASSWORD = 'vexor2024';

let selectedImages = [];
let editNewImages = [];
let allProductsData = [];
let currentListFilter = 'all';

// ==== Login ====
function login() {
  const user = document.getElementById('username').value.trim();
  const pass = document.getElementById('password').value.trim();
  const savedUser = localStorage.getItem('cv_username') || DEFAULT_USERNAME;
  const savedPass = localStorage.getItem('cv_password') || DEFAULT_PASSWORD;
  if (user === savedUser && pass === savedPass) {
    sessionStorage.setItem('cv_logged_in', 'true');
    showDashboard();
  } else {
    document.getElementById('errorMsg').classList.add('show');
    setTimeout(() => document.getElementById('errorMsg').classList.remove('show'), 3000);
  }
}
document.getElementById('password').addEventListener('keypress', e => { if (e.key === 'Enter') login(); });

function showDashboard() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('dashboard').classList.add('active');
  loadProducts();
  loadSettings();
}
function logout() {
  sessionStorage.removeItem('cv_logged_in');
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('dashboard').classList.remove('active');
}
window.addEventListener('load', () => {
  if (sessionStorage.getItem('cv_logged_in') === 'true') showDashboard();
});

function switchTab(name, btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-' + name).classList.add('active');
}

function showStatus(msg, type = 'loading') {
  const box = document.getElementById('statusBox');
  box.className = 'status show ' + type;
  box.textContent = msg;
  if (type !== 'loading') setTimeout(() => box.classList.remove('show'), 4000);
}

// ==== Category Fields ====
function updateCategoryFields() {
  const cat = document.getElementById('pCategory').value;
  document.getElementById('fields-clash').style.display = (cat === 'کلش') ? 'grid' : 'none';
  document.getElementById('fields-cod').style.display = (cat === 'کالاف') ? 'grid' : 'none';
  document.getElementById('fields-item').style.display = (cat.includes('آیتم')) ? 'grid' : 'none';
}

// ==== Image Compression + Upload ====
async function compressAndUpload(file) {
  try {
    // فشرده‌سازی
    const options = {
      maxSizeMB: 0.3,
      maxWidthOrHeight: 1200,
      useWebWorker: true,
      fileType: 'image/jpeg',
      initialQuality: 0.8
    };
    const compressedFile = await imageCompression(file, options);

    // ساخت اسم
    const fileName = `${Date.now()}-${Math.random().toString(36).substr(2, 9)}.jpg`;

    // آپلود
    const res = await fetch(`${SUPABASE_URL}/storage/v1/object/product-images/${fileName}`, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Content-Type': 'image/jpeg'
      },
      body: compressedFile
    });

    if (!res.ok) throw new Error('خطا در آپلود');
    return `${SUPABASE_URL}/storage/v1/object/public/product-images/${fileName}`;
  } catch (err) {
    console.error('خطا:', err);
    throw err;
  }
}

// ==== Add Product Images ====
function handleImages(event) {
  const files = Array.from(event.target.files);
  selectedImages = [...selectedImages, ...files];
  renderImagePreviews();
}
function renderImagePreviews() {
  const preview = document.getElementById('imagesPreview');
  preview.innerHTML = '';
  selectedImages.forEach((file, i) => {
    const url = URL.createObjectURL(file);
    const item = document.createElement('div');
    item.className = 'img-preview-item';
    item.innerHTML = `<img src="${url}"><button class="remove" onclick="removeImage(${i})">×</button>`;
    preview.appendChild(item);
  });
}
function removeImage(i) {
  selectedImages.splice(i, 1);
  renderImagePreviews();
}

// ==== Add Product ====
async function addProduct() {
  const title = document.getElementById('pTitle').value.trim();
  const price = document.getElementById('pPrice').value.trim();
  const cat = document.getElementById('pCategory').value;

  if (!title || !price) {
    showStatus('❌ عنوان و قیمت اجباری!', 'error');
    return;
  }

  const btn = document.getElementById('addBtn');
  btn.disabled = true;
  btn.textContent = '⏳ در حال ذخیره...';

  try {
    let imageUrls = [];
    if (selectedImages.length > 0) {
      showStatus('⏳ فشرده‌سازی و آپلود عکس‌ها...', 'loading');
      imageUrls = await Promise.all(selectedImages.map(compressAndUpload));
    }

    showStatus('⏳ در حال ذخیره...', 'loading');

    const product = {
      title: title,
      slogan: document.getElementById('pSlogan').value.trim(),
      category: cat,
      account_code: document.getElementById('pCode').value.trim(),
      price: parseInt(price),
      price_usd: document.getElementById('pPriceUsd').value.trim(),
      description: document.getElementById('pDesc').value.trim(),
      status: document.getElementById('pStatus').value,
      images: imageUrls
    };

    if (cat === 'کلش') {
      product.town_hall = parseInt(document.getElementById('pTownHall').value) || null;
      product.builder_level = parseInt(document.getElementById('pBuilder').value) || null;
      product.name_changes = parseInt(document.getElementById('pNameChanges').value) || null;
    } else if (cat === 'کالاف') {
      product.rank = document.getElementById('pRank').value.trim();
      product.player_level = parseInt(document.getElementById('pPlayerLevel').value) || null;
      product.skins_count = parseInt(document.getElementById('pSkins').value) || null;
    } else if (cat.includes('آیتم')) {
      product.item_type = document.getElementById('pItemType').value.trim();
      product.item_amount = document.getElementById('pItemAmount').value.trim();
    }

    const res = await fetch(`${SUPABASE_URL}/rest/v1/products`, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Content-Type': 'application/json',
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify(product)
    });

    if (res.ok) {
      showStatus('🎉 محصول ثبت شد!', 'success');
      ['pTitle','pSlogan','pTownHall','pBuilder','pNameChanges','pRank','pPlayerLevel','pSkins','pItemType','pItemAmount','pCode','pPrice','pPriceUsd','pDesc'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.value = '';
      });
      selectedImages = [];
      renderImagePreviews();
      loadProducts();
    } else {
      const err = await res.text();
      showStatus('❌ خطا: ' + err, 'error');
    }
  } catch (err) {
    showStatus('❌ خطا: ' + err.message, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = '🚀 ثبت محصول';
  }
}

// ==== Load Products ====
async function loadProducts() {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/products?select=*&order=id.desc`, {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
    });
    allProductsData = await res.json();
    filterList(currentListFilter);
  } catch (err) { console.error(err); }
}

function filterList(status) {
  currentListFilter = status;
  let filtered = allProductsData;
  if (status !== 'all') {
    filtered = allProductsData.filter(p => p.status === status);
  }
  renderProducts(filtered);
}

function renderProducts(products) {
  const list = document.getElementById('productsList');
  if (!products || products.length === 0) {
    list.innerHTML = `<div class="empty-state"><div class="icon">📦</div><p>محصولی نیست</p></div>`;
    return;
  }
  list.innerHTML = products.map(p => {
    const img = p.images && p.images[0] ? `<img src="${p.images[0]}" class="product-thumb">` : '<div style="font-size:2rem;">🎯</div>';
    const statusClass = p.status === 'موجود' ? 'available' : (p.status === 'فروش رفته' ? 'sold' : 'unavailable');
    const statusIcon = p.status === 'موجود' ? '✅' : (p.status === 'فروش رفته' ? '🔴' : '❌');
    return `
      <div class="product-item">
        ${img}
        <div class="product-details">
          <h4>${p.title}</h4>
          <p>${p.category} | کد: ${p.account_code || '-'}</p>
        </div>
        <div class="product-price">
          ${Number(p.price).toLocaleString('fa-IR')} ت
          ${p.price_usd ? '<br><span style="font-size:0.75rem;color:#a855f7;">' + p.price_usd + '</span>' : ''}
        </div>
        <span class="status-badge ${statusClass}" onclick="toggleStatus(${p.id}, '${p.status}')">
          ${statusIcon} ${p.status}
        </span>
        <div class="product-actions">
          <button class="btn-icon" onclick="openEditModal(${p.id})" title="ویرایش">✏️</button>
          <button class="btn-icon danger" onclick="deleteProduct(${p.id})" title="حذف">🗑️</button>
        </div>
      </div>
    `;
  }).join('');
}

// ==== Toggle Status ====
async function toggleStatus(id, currentStatus) {
  let newStatus;
  if (currentStatus === 'موجود') newStatus = 'فروش رفته';
  else if (currentStatus === 'فروش رفته') newStatus = 'ناموجود';
  else newStatus = 'موجود';

  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/products?id=eq.${id}`, {
      method: 'PATCH',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ status: newStatus })
    });
    if (res.ok) {
      showStatus(`✅ وضعیت به "${newStatus}" تغییر کرد`, 'success');
      loadProducts();
    }
  } catch (err) { showStatus('❌ خطا', 'error'); }
}

// ==== Edit Modal ====
function openEditModal(id) {
  const p = allProductsData.find(x => x.id === id);
  if (!p) return;

  document.getElementById('editId').value = p.id;
  document.getElementById('editTitle').value = p.title || '';
  document.getElementById('editSlogan').value = p.slogan || '';
  document.getElementById('editCategory').value = p.category || 'کلش';
  document.getElementById('editTownHall').value = p.town_hall || '';
  document.getElementById('editBuilder').value = p.builder_level || '';
  document.getElementById('editNameChanges').value = p.name_changes || '';
  document.getElementById('editRank').value = p.rank || '';
  document.getElementById('editPlayerLevel').value = p.player_level || '';
  document.getElementById('editSkins').value = p.skins_count || '';
  document.getElementById('editItemType').value = p.item_type || '';
  document.getElementById('editItemAmount').value = p.item_amount || '';
  document.getElementById('editCode').value = p.account_code || '';
  document.getElementById('editPrice').value = p.price || '';
  document.getElementById('editPriceUsd').value = p.price_usd || '';
  document.getElementById('editStatus').value = p.status || 'موجود';
  document.getElementById('editDesc').value = p.description || '';

  // عکس‌های موجود
  const images = p.images || [];
  document.getElementById('editImages').value = JSON.stringify(images);
  renderExistingImages(images);

  editNewImages = [];
  renderEditImagesPreview();

  document.getElementById('editModal').classList.add('show');
}

function renderExistingImages(images) {
  const container = document.getElementById('existingImages');
  if (!images || images.length === 0) {
    container.innerHTML = '<p style="color:#666;font-size:0.85rem;">عکسی نداره</p>';
    return;
  }
  container.innerHTML = images.map((img, i) => `
    <div class="existing-img-item">
      <img src="${img}">
      <button class="delete-img" onclick="removeExistingImage(${i})">×</button>
    </div>
  `).join('');
}

function removeExistingImage(index) {
  const images = JSON.parse(document.getElementById('editImages').value);
  images.splice(index, 1);
  document.getElementById('editImages').value = JSON.stringify(images);
  renderExistingImages(images);
}

function closeEditModal() {
  document.getElementById('editModal').classList.remove('show');
}

// ==== Edit Images ====
function handleEditImages(event) {
  const files = Array.from(event.target.files);
  editNewImages = [...editNewImages, ...files];
  renderEditImagesPreview();
}
function renderEditImagesPreview() {
  const preview = document.getElementById('editImagesPreview');
  preview.innerHTML = '';
  editNewImages.forEach((file, i) => {
    const url = URL.createObjectURL(file);
    const item = document.createElement('div');
    item.className = 'img-preview-item';
    item.innerHTML = `<img src="${url}"><button class="remove" onclick="removeEditImage(${i})">×</button>`;
    preview.appendChild(item);
  });
}
function removeEditImage(i) {
  editNewImages.splice(i, 1);
  renderEditImagesPreview();
}

// ==== Save Edit ====
async function saveEdit() {
  const id = document.getElementById('editId').value;
  const title = document.getElementById('editTitle').value.trim();
  const price = document.getElementById('editPrice').value.trim();

  if (!title || !price) {
    alert('عنوان و قیمت اجباری هستن!');
    return;
  }

  const btn = document.getElementById('saveEditBtn');
  btn.disabled = true;
  btn.textContent = '⏳ ذخیره...';

  try {
    let existingImages = JSON.parse(document.getElementById('editImages').value);

    // آپلود عکس‌های جدید
    if (editNewImages.length > 0) {
      btn.textContent = '⏳ آپلود عکس...';
      const newUrls = await Promise.all(editNewImages.map(compressAndUpload));
      existingImages = [...existingImages, ...newUrls];
    }

    const updateData = {
      title: title,
      slogan: document.getElementById('editSlogan').value.trim(),
      category: document.getElementById('editCategory').value,
      town_hall: parseInt(document.getElementById('editTownHall').value) || null,
      builder_level: parseInt(document.getElementById('editBuilder').value) || null,
      name_changes: parseInt(document.getElementById('editNameChanges').value) || null,
      rank: document.getElementById('editRank').value.trim(),
      player_level: parseInt(document.getElementById('editPlayerLevel').value) || null,
      skins_count: parseInt(document.getElementById('editSkins').value) || null,
      item_type: document.getElementById('editItemType').value.trim(),
      item_amount: document.getElementById('editItemAmount').value.trim(),
      account_code: document.getElementById('editCode').value.trim(),
      price: parseInt(price),
      price_usd: document.getElementById('editPriceUsd').value.trim(),
      status: document.getElementById('editStatus').value,
      description: document.getElementById('editDesc').value.trim(),
      images: existingImages
    };

    const res = await fetch(`${SUPABASE_URL}/rest/v1/products?id=eq.${id}`, {
      method: 'PATCH',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(updateData)
    });

    if (res.ok) {
      showStatus('🎉 تغییرات ذخیره شد!', 'success');
      closeEditModal();
      loadProducts();
    } else {
      alert('خطا در ذخیره');
    }
  } catch (err) {
    alert('خطا: ' + err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = '💾 ذخیره تغییرات';
  }
}

// ==== Delete ====
async function deleteProduct(id) {
  if (!confirm('مطمئنی؟')) return;
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/products?id=eq.${id}`, {
      method: 'DELETE',
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
    });
    if (res.ok) { showStatus('🗑️ حذف شد', 'success'); loadProducts(); }
  } catch (err) { showStatus('❌ خطا', 'error'); }
}

// ==== Settings ====
async function loadSettings() {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/shop_settings?id=eq.1&select=*`, {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
    });
    const data = await res.json();
    if (data && data.length > 0) {
      document.getElementById('phone').value = data[0].phone || '';
      document.getElementById('rubika').value = data[0].rubika_id || '';
    }
  } catch (err) { console.error(err); }
}

async function saveSettings() {
  const phone = document.getElementById('phone').value.trim();
  const rubika = document.getElementById('rubika').value.trim();
  if (!phone || !rubika) { showStatus('❌ کامل کن!', 'error'); return; }
  showStatus('⏳ ذخیره...', 'loading');
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/shop_settings?id=eq.1`, {
      method: 'PATCH',
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone, rubika_id: rubika, updated_at: new Date().toISOString() })
    });
    if (res.ok) showStatus('🎉 ذخیره شد!', 'success');
  } catch (err) { showStatus('❌ خطا', 'error'); }
}

updateCategoryFields();
</script>
