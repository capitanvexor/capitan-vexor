<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پنل مدیریت | 𝑪𝑨𝑷𝑰𝑻𝑨𝑵..-𝒗𝒆𝒙𝒐𝒓</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Vazirmatn', Tahoma, sans-serif; }
:root {
  --bg-dark: #0a0a0f;
  --cyan: #00ffe7;
  --purple: #a855f7;
  --pink: #ff2ec4;
  --text: #ffffff;
  --text-dim: #a0a0b0;
  --glass: rgba(255,255,255,0.04);
  --border: rgba(0,255,231,0.2);
  --danger: #ff3860;
  --success: #10b981;
}
body { background: var(--bg-dark); color: var(--text); min-height: 100vh; overflow-x: hidden; }
.bg-glow { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
.bg-glow::before, .bg-glow::after {
  content: ''; position: absolute; border-radius: 50%; filter: blur(120px); opacity: 0.4;
  animation: float 12s ease-in-out infinite;
}
.bg-glow::before { width: 500px; height: 500px; background: var(--cyan); top: -100px; right: -100px; }
.bg-glow::after { width: 600px; height: 600px; background: var(--purple); bottom: -150px; left: -150px; animation-delay: -6s; }
@keyframes float { 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(50px,50px) scale(1.1);} }

/* Login */
.login-screen { min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
.login-box {
  background: var(--glass); border: 1px solid var(--border); border-radius: 25px;
  padding: 45px 35px; backdrop-filter: blur(20px); width: 100%; max-width: 420px;
  text-align: center; box-shadow: 0 25px 60px rgba(0,255,231,0.1);
}
.login-icon { font-size: 4rem; margin-bottom: 15px; filter: drop-shadow(0 0 25px var(--cyan)); animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.05);} }
.login-box h1 {
  font-size: 1.5rem; margin-bottom: 8px;
  background: linear-gradient(90deg, var(--cyan), var(--purple));
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; font-weight: 900;
}
.login-box .subtitle { color: var(--text-dim); font-size: 0.9rem; margin-bottom: 30px; }
.input-group { position: relative; margin-bottom: 18px; }
.input-group input {
  width: 100%; padding: 15px 45px 15px 18px;
  background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 12px;
  color: var(--text); font-size: 1rem; outline: none; transition: 0.3s; font-family: inherit;
}
.input-group input:focus { border-color: var(--cyan); box-shadow: 0 0 20px rgba(0,255,231,0.3); }
.input-group .icon { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); font-size: 1.2rem; opacity: 0.6; }
.login-btn {
  width: 100%; padding: 15px; background: linear-gradient(90deg, var(--cyan), var(--purple));
  color: #0a0a0f; border: none; border-radius: 12px; font-size: 1rem; font-weight: 700;
  cursor: pointer; transition: 0.3s; font-family: inherit; margin-top: 10px; box-shadow: 0 0 25px rgba(0,255,231,0.4);
}
.login-btn:hover { transform: translateY(-2px); box-shadow: 0 0 40px rgba(0,255,231,0.7); }
.error-msg { background: rgba(255,56,96,0.15); border: 1px solid var(--danger); color: var(--danger); padding: 12px; border-radius: 10px; margin-top: 15px; font-size: 0.9rem; display: none; }
.error-msg.show { display: block; }
.back-link { display: inline-block; margin-top: 20px; color: var(--text-dim); text-decoration: none; font-size: 0.85rem; }
.back-link:hover { color: var(--cyan); }

/* Dashboard */
.dashboard { display: none; padding: 20px; max-width: 1000px; margin: 0 auto; }
.dashboard.active { display: block; }
.dash-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 20px; background: var(--glass); border: 1px solid var(--border);
  border-radius: 18px; margin-bottom: 25px; backdrop-filter: blur(20px);
  flex-wrap: wrap; gap: 15px;
}
.dash-header h1 {
  font-size: 1.3rem; background: linear-gradient(90deg, var(--cyan), var(--purple));
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; font-weight: 900;
}
.logout-btn {
  padding: 10px 20px; background: rgba(255,56,96,0.15); border: 1px solid var(--danger);
  color: var(--danger); border-radius: 10px; cursor: pointer; font-family: inherit;
  font-weight: 600; transition: 0.3s; font-size: 0.85rem;
}
.logout-btn:hover { background: var(--danger); color: white; }

/* Tabs */
.tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
.tab {
  padding: 12px 22px; background: var(--glass); border: 1px solid var(--border);
  border-radius: 12px; cursor: pointer; transition: 0.3s; font-family: inherit;
  color: var(--text-dim); font-weight: 600; font-size: 0.9rem;
}
.tab:hover { color: var(--cyan); border-color: var(--cyan); }
.tab.active {
  background: linear-gradient(135deg, rgba(0,255,231,0.15), rgba(168,85,247,0.15));
  color: var(--cyan); border-color: var(--cyan);
}
.tab-content { display: none; }
.tab-content.active { display: block; }

/* Card */
.card {
  background: var(--glass); border: 1px solid var(--border); border-radius: 20px;
  padding: 25px; backdrop-filter: blur(20px); margin-bottom: 20px;
}
.card-title {
  font-size: 1.1rem; font-weight: 700; color: var(--cyan);
  margin-bottom: 20px; display: flex; align-items: center; gap: 10px;
}
.form-group { margin-bottom: 15px; }
.form-group label {
  display: block; font-size: 0.85rem; color: var(--text-dim);
  margin-bottom: 6px; font-weight: 600;
}
.form-group input, .form-group textarea, .form-group select {
  width: 100%; padding: 13px 16px; background: rgba(0,0,0,0.3);
  border: 1px solid var(--border); border-radius: 10px;
  color: var(--text); font-size: 0.95rem; outline: none; transition: 0.3s; font-family: inherit;
}
.form-group input:focus, .form-group textarea:focus, .form-group select:focus {
  border-color: var(--cyan); box-shadow: 0 0 15px rgba(0,255,231,0.2);
}
.form-group .hint { font-size: 0.75rem; color: #666; margin-top: 5px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
.form-row.three { grid-template-columns: 1fr 1fr 1fr; }

.save-btn {
  width: 100%; padding: 14px; background: linear-gradient(90deg, var(--cyan), var(--purple));
  color: #0a0a0f; border: none; border-radius: 12px; font-size: 1rem; font-weight: 700;
  cursor: pointer; transition: 0.3s; font-family: inherit; box-shadow: 0 0 25px rgba(0,255,231,0.4);
}
.save-btn:hover { transform: translateY(-2px); box-shadow: 0 0 40px rgba(0,255,231,0.7); }
.save-btn:disabled { opacity: 0.6; cursor: not-allowed; }

/* Image Upload */
.upload-area {
  border: 2px dashed var(--border); border-radius: 12px; padding: 30px 20px;
  text-align: center; cursor: pointer; transition: 0.3s;
  background: rgba(0,0,0,0.2);
}
.upload-area:hover { border-color: var(--cyan); background: rgba(0,255,231,0.05); }
.upload-area .icon { font-size: 3rem; margin-bottom: 10px; }
.upload-area p { color: var(--text-dim); font-size: 0.9rem; }
.upload-area input { display: none; }
.images-preview {
  display: flex; gap: 10px; flex-wrap: wrap; margin-top: 15px;
}
.img-preview-item {
  position: relative; width: 80px; height: 80px; border-radius: 10px;
  overflow: hidden; border: 2px solid var(--border);
}
.img-preview-item img { width: 100%; height: 100%; object-fit: cover; }
.img-preview-item .remove {
  position: absolute; top: 3px; right: 3px; background: rgba(255,56,96,0.9);
  color: white; border: none; border-radius: 50%; width: 22px; height: 22px;
  cursor: pointer; font-size: 0.8rem; display: flex; align-items: center; justify-content: center;
}

/* Status */
.status {
  padding: 15px 20px; border-radius: 12px; margin-bottom: 20px;
  font-weight: 600; display: none; align-items: center; gap: 10px;
}
.status.show { display: flex; }
.status.success { background: rgba(16,185,129,0.15); border: 1px solid var(--success); color: var(--success); }
.status.error { background: rgba(255,56,96,0.15); border: 1px solid var(--danger); color: var(--danger); }
.status.loading { background: rgba(0,255,231,0.1); border: 1px solid var(--cyan); color: var(--cyan); }

/* Products List */
.products-list { display: grid; gap: 12px; }
.product-item {
  background: rgba(0,0,0,0.3); border: 1px solid var(--border);
  border-radius: 12px; padding: 15px;
  display: flex; justify-content: space-between; align-items: center;
  gap: 15px; flex-wrap: wrap;
}
.product-thumb {
  width: 60px; height: 60px; border-radius: 10px; object-fit: cover;
  border: 1px solid var(--border);
}
.product-details h4 { font-size: 1rem; margin-bottom: 3px; }
.product-details p { font-size: 0.8rem; color: var(--text-dim); }
.product-price { color: var(--cyan); font-weight: 700; font-size: 0.9rem; }
.btn-icon {
  width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--border);
  background: transparent; color: var(--text); cursor: pointer; transition: 0.3s;
  font-size: 1rem; display: flex; align-items: center; justify-content: center;
}
.btn-icon:hover { background: rgba(0,255,231,0.1); border-color: var(--cyan); }
.btn-icon.danger:hover { background: rgba(255,56,96,0.15); border-color: var(--danger); color: var(--danger); }

.empty-state { text-align: center; padding: 40px 20px; color: var(--text-dim); }
.empty-state .icon { font-size: 3rem; margin-bottom: 10px; opacity: 0.5; }

@media (max-width: 600px) {
  .login-box { padding: 35px 25px; }
  .card { padding: 18px; }
  .form-row, .form-row.three { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="bg-glow"></div>

<!-- Login -->
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <div class="login-icon">🔐</div>
    <h1>𝑪𝑨𝑷𝑰𝑻𝑨𝑵..-𝒗𝒆𝒙𝒐𝒓</h1>
    <p class="subtitle">ورود به پنل مدیریت</p>
    <div class="input-group">
      <span class="icon">👤</span>
      <input type="text" id="username" placeholder="نام کاربری">
    </div>
    <div class="input-group">
      <span class="icon">🔑</span>
      <input type="password" id="password" placeholder="رمز عبور">
    </div>
    <button class="login-btn" onclick="login()">🚀 ورود به پنل</button>
    <div class="error-msg" id="errorMsg">❌ نام کاربری یا رمز عبور اشتباه است!</div>
    <a href="../" class="back-link">← بازگشت به سایت</a>
  </div>
</div>

<!-- Dashboard -->
<div class="dashboard" id="dashboard">
  <div class="dash-header">
    <h1>⚓ پنل مدیریت کاپیتان وکتور</h1>
    <button class="logout-btn" onclick="logout()">🚪 خروج</button>
  </div>

  <div id="statusBox" class="status"></div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('add', this)">➕ افزودن اکانت</button>
    <button class="tab" onclick="switchTab('list', this)">📦 لیست اکانت‌ها</button>
    <button class="tab" onclick="switchTab('contact', this)">📞 اطلاعات تماس</button>
  </div>

  <!-- Tab: Add Product -->
  <div class="tab-content active" id="tab-add">
    <div class="card">
      <div class="card-title">➕ افزودن اکانت جدید</div>

      <div class="form-group">
        <label>🎮 عنوان اکانت *</label>
        <input type="text" id="pTitle" placeholder="مثلاً: اکانت کلش آف کلنز TH14 پر مانع">
      </div>

      <div class="form-group">
        <label>💬 شعار (اختیاری)</label>
        <input type="text" id="pSlogan" placeholder="مثلاً: 🔥 نقد و اقساط تضمینی 🔥">
      </div>

      <div class="form-row three">
        <div class="form-group">
          <label>🏰 تاون هال *</label>
          <input type="number" id="pTownHall" placeholder="12">
        </div>
        <div class="form-group">
          <label>🏗️ لول بیلدر</label>
          <input type="number" id="pBuilder" placeholder="10">
        </div>
        <div class="form-group">
          <label>✏️ تعداد تغییر نام</label>
          <input type="number" id="pNameChanges" placeholder="1">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>🆔 کد اکانت *</label>
          <input type="text" id="pCode" placeholder="مثلاً: 232" dir="ltr">
        </div>
        <div class="form-group">
          <label>💰 قیمت (تومان) *</label>
          <input type="number" id="pPrice" placeholder="مثلاً: 5800000">
        </div>
      </div>

      <div class="form-group">
        <label>📝 توضیحات</label>
        <textarea id="pDesc" rows="3" placeholder="توضیحات کامل درباره اکانت..."></textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>✅ وضعیت</label>
          <select id="pStatus">
            <option value="موجود">✅ موجود</option>
            <option value="ناموجود">❌ ناموجود</option>
            <option value="فروش رفته">🔴 فروش رفته</option>
          </select>
        </div>
        <div class="form-group">
          <label>📂 دسته‌بندی</label>
          <select id="pCategory">
            <option value="اکانت‌ها">🎮 اکانت‌ها</option>
            <option value="آیتم‌ها">🏆 آیتم‌ها</option>
            <option value="فری فایر">🔥 فری فایر</option>
            <option value="کالاف">🎯 کالاف</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>📸 عکس‌های اکانت (چندتایی)</label>
        <div class="upload-area" onclick="document.getElementById('pImages').click()">
          <div class="icon">🖼️</div>
          <p>برای انتخاب عکس‌ها کلیک کن</p>
          <p style="font-size: 0.75rem; color: #666; margin-top: 5px;">می‌تونی چند تا عکس انتخاب کنی</p>
          <input type="file" id="pImages" accept="image/*" multiple onchange="handleImages(event)">
        </div>
        <div class="images-preview" id="imagesPreview"></div>
      </div>

      <button class="save-btn" id="addBtn" onclick="addProduct()">🚀 ثبت اکانت</button>
    </div>
  </div>

  <!-- Tab: List Products -->
  <div class="tab-content" id="tab-list">
    <div class="card">
      <div class="card-title">📦 لیست اکانت‌ها</div>
      <div class="products-list" id="productsList"></div>
    </div>
  </div>

  <!-- Tab: Contact -->
  <div class="tab-content" id="tab-contact">
    <div class="card">
      <div class="card-title">📞 اطلاعات تماس</div>
      <div class="form-group">
        <label>📱 شماره تماس</label>
        <input type="text" id="phone" placeholder="09388499513" dir="ltr">
      </div>
      <div class="form-group">
        <label>💬 آیدی روبیکا (بدون @)</label>
        <input type="text" id="rubika" placeholder="oooo1219" dir="ltr">
      </div>
      <button class="save-btn" onclick="saveSettings()">💾 ذخیره اطلاعات تماس</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://pvghoflyhkppgpralypc.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB2Z2hvZmx5aGtwcGdwcmFseXBjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzMjcwODIsImV4cCI6MjEwNTkwMzA4Mn0.yaYfCSXUegLwB3AQDuj733xyCZK49J95W2Gey6EAiWw';

const DEFAULT_USERNAME = 'admin';
const DEFAULT_PASSWORD = 'vexor2024';

let selectedImages = [];

// ===== Login =====
function login() {
  const user = document.getElementById('username').value.trim();
  const pass = document.getElementById('password').value.trim();
  const savedUser = localStorage.getItem('cv_username') || DEFAULT_USERNAME;
  const savedPass = localStorage.getItem('cv_password') || DEFAULT_PASSWORD;
  if (user === savedUser && pass === savedPass) {
    sessionStorage.setItem('cv_logged_in', 'true');
    showDashboard();
  } else {
    document.getElementById('errorMsg').classList.add('show');
    setTimeout(() => document.getElementById('errorMsg').classList.remove('show'), 3000);
  }
}
document.getElementById('password').addEventListener('keypress', e => { if (e.key === 'Enter') login(); });

function showDashboard() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('dashboard').classList.add('active');
  loadProducts();
  loadSettings();
}
function logout() {
  sessionStorage.removeItem('cv_logged_in');
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('dashboard').classList.remove('active');
}
window.addEventListener('load', () => {
  if (sessionStorage.getItem('cv_logged_in') === 'true') showDashboard();
});

function switchTab(name, btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-' + name).classList.add('active');
}

function showStatus(msg, type = 'loading') {
  const box = document.getElementById('statusBox');
  box.className = 'status show ' + type;
  box.textContent = msg;
  if (type !== 'loading') setTimeout(() => box.classList.remove('show'), 4000);
}

// ===== Image Upload =====
function handleImages(event) {
  const files = Array.from(event.target.files);
  selectedImages = [...selectedImages, ...files];
  renderImagePreviews();
}

function renderImagePreviews() {
  const preview = document.getElementById('imagesPreview');
  preview.innerHTML = '';
  selectedImages.forEach((file, i) => {
    const url = URL.createObjectURL(file);
    const item = document.createElement('div');
    item.className = 'img-preview-item';
    item.innerHTML = `
      <img src="${url}">
      <button class="remove" onclick="removeImage(${i})">×</button>
    `;
    preview.appendChild(item);
  });
}

function removeImage(i) {
  selectedImages.splice(i, 1);
  renderImagePreviews();
}

// ===== Upload to Supabase Storage =====
async function uploadImage(file) {
  const ext = file.name.split('.').pop();
  const fileName = `${Date.now()}-${Math.random().toString(36).substr(2, 9)}.${ext}`;
  const res = await fetch(`${SUPABASE_URL}/storage/v1/object/product-images/${fileName}`, {
    method: 'POST',
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`,
      'Content-Type': file.type
    },
    body: file
  });
  if (!res.ok) throw new Error('خطا در آپلود عکس');
  return `${SUPABASE_URL}/storage/v1/object/public/product-images/${fileName}`;
}

// ===== Add Product =====
async function addProduct() {
  const title = document.getElementById('pTitle').value.trim();
  const code = document.getElementById('pCode').value.trim();
  const price = document.getElementById('pPrice').value.trim();
  const townHall = document.getElementById('pTownHall').value.trim();

  if (!title || !code || !price || !townHall) {
    showStatus('❌ عنوان، تاون هال، کد اکانت و قیمت اجباری هستن!', 'error');
    return;
  }

  const btn = document.getElementById('addBtn');
  btn.disabled = true;
  btn.textContent = '⏳ در حال ذخیره...';

  try {
    // آپلود عکس‌ها
    let imageUrls = [];
    if (selectedImages.length > 0) {
      showStatus('⏳ در حال آپلود عکس‌ها...', 'loading');
      imageUrls = await Promise.all(selectedImages.map(uploadImage));
    }

    showStatus('⏳ در حال ذخیره اکانت...', 'loading');

    const product = {
      title: title,
      slogan: document.getElementById('pSlogan').value.trim(),
      town_hall: parseInt(townHall),
      builder_level: parseInt(document.getElementById('pBuilder').value) || null,
      name_changes: parseInt(document.getElementById('pNameChanges').value) || null,
      account_code: code,
      price: parseInt(price),
      description: document.getElementById('pDesc').value.trim(),
      status: document.getElementById('pStatus').value,
      category: document.getElementById('pCategory').value,
      images: imageUrls
    };

    const res = await fetch(`${SUPABASE_URL}/rest/v1/products`, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Content-Type': 'application/json',
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify(product)
    });

    if (res.ok) {
      showStatus('🎉 اکانت با موفقیت ثبت شد!', 'success');
      // Reset form
      document.getElementById('pTitle').value = '';
      document.getElementById('pSlogan').value = '';
      document.getElementById('pTownHall').value = '';
      document.getElementById('pBuilder').value = '';
      document.getElementById('pNameChanges').value = '';
      document.getElementById('pCode').value = '';
      document.getElementById('pPrice').value = '';
      document.getElementById('pDesc').value = '';
      selectedImages = [];
      renderImagePreviews();
      loadProducts();
    } else {
      const err = await res.text();
      showStatus('❌ خطا: ' + err, 'error');
    }
  } catch (err) {
    showStatus('❌ خطا: ' + err.message, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = '🚀 ثبت اکانت';
  }
}

// ===== Load Products =====
async function loadProducts() {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/products?select=*&order=id.desc`, {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
    });
    const products = await res.json();
    renderProducts(products);
  } catch (err) {
    console.error(err);
  }
}

function renderProducts(products) {
  const list = document.getElementById('productsList');
  if (!products || products.length === 0) {
    list.innerHTML = `<div class="empty-state"><div class="icon">📦</div><p>هنوز اکانتی اضافه نکردی!</p></div>`;
    return;
  }
  list.innerHTML = products.map(p => {
    const img = p.images && p.images[0] ? `<img src="${p.images[0]}" class="product-thumb">` : '🎯';
    return `
      <div class="product-item">
        ${img.startsWith('<') ? img : `<div style="font-size:2rem;">🎯</div>`}
        <div class="product-details">
          <h4>${p.title}</h4>
          <p>کد: ${p.account_code} | تان: ${p.town_hall} | ${p.status}</p>
        </div>
        <div class="product-price">${Number(p.price).toLocaleString('fa-IR')} ت</div>
        <button class="btn-icon danger" onclick="deleteProduct(${p.id})">🗑️</button>
      </div>
    `;
  }).join('');
}

async function deleteProduct(id) {
  if (!confirm('مطمئنی؟')) return;
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/products?id=eq.${id}`, {
      method: 'DELETE',
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
    });
    if (res.ok) {
      showStatus('🗑️ حذف شد', 'success');
      loadProducts();
    }
  } catch (err) { showStatus('❌ خطا', 'error'); }
}

// ===== Settings =====
async function loadSettings() {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/shop_settings?id=eq.1&select=*`, {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
    });
    const data = await res.json();
    if (data && data.length > 0) {
      document.getElementById('phone').value = data[0].phone || '';
      document.getElementById('rubika').value = data[0].rubika_id || '';
    }
  } catch (err) { console.error(err); }
}

async function saveSettings() {
  const phone = document.getElementById('phone').value.trim();
  const rubika = document.getElementById('rubika').value.trim();
  if (!phone || !rubika) { showStatus('❌ کامل کن!', 'error'); return; }
  showStatus('⏳ ذخیره...', 'loading');
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/shop_settings?id=eq.1`, {
      method: 'PATCH',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ phone, rubika_id: rubika, updated_at: new Date().toISOString() })
    });
    if (res.ok) showStatus('🎉 ذخیره شد!', 'success');
    else showStatus('❌ خطا', 'error');
  } catch (err) { showStatus('❌ خطا: ' + err.message, 'error'); }
}
</script>
