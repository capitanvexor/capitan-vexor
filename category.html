<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دسته‌بندی | 𝑪𝑨𝑷𝑰𝑻𝑨𝑵..-𝒗𝒆𝒙𝒐𝒓</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0a0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Capitan Vexor">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Vazirmatn', Tahoma, sans-serif; }
:root {
  --bg-dark: #0a0a0f;
  --cyan: #00ffe7;
  --purple: #a855f7;
  --pink: #ff2ec4;
  --text: #ffffff;
  --text-dim: #a0a0b0;
  --glass: rgba(255,255,255,0.04);
  --border: rgba(0,255,231,0.2);
  --success: #10b981;
  --danger: #ff3860;
}
html { scroll-behavior: smooth; }
body { background: var(--bg-dark); color: var(--text); min-height: 100vh; line-height: 1.7; overflow-x: hidden; }
.bg-glow { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
.bg-glow::before, .bg-glow::after {
  content: ''; position: absolute; border-radius: 50%; filter: blur(130px); opacity: 0.4;
  animation: float 14s ease-in-out infinite;
}
.bg-glow::before { width: 500px; height: 500px; background: var(--cyan); top: -100px; right: -100px; }
.bg-glow::after { width: 600px; height: 600px; background: var(--purple); bottom: -150px; left: -150px; animation-delay: -7s; }
@keyframes float { 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(60px,60px) scale(1.15);} }

nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
  padding: 15px 20px; background: rgba(10,10,15,0.9);
  backdrop-filter: blur(20px); border-bottom: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
}
.logo {
  font-weight: 900; font-size: 1.3rem; text-decoration: none;
  background: linear-gradient(90deg, var(--cyan), var(--purple), var(--pink));
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  letter-spacing: 1px;
}
.nav-links { display: flex; gap: 20px; list-style: none; flex-wrap: wrap; }
.nav-links a { color: var(--text-dim); text-decoration: none; font-weight: 500; font-size: 0.9rem; transition: 0.3s; }
.nav-links a:hover, .nav-links a.active { color: var(--cyan); }

.container { max-width: 1200px; margin: 0 auto; padding: 100px 20px 60px; }
.cat-header { text-align: center; margin-bottom: 35px; }
.cat-header .cat-icon { font-size: 4rem; margin-bottom: 10px; display: inline-block; }
.cat-header h1 {
  font-size: clamp(1.8rem, 4vw, 2.5rem); font-weight: 900; margin-bottom: 8px;
  background: linear-gradient(90deg, var(--cyan), var(--purple));
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
}
.cat-header p { color: var(--text-dim); font-size: 0.95rem; }

.back-btn {
  display: inline-flex; align-items: center; gap: 6px;
  color: var(--text-dim); text-decoration: none; font-size: 0.9rem;
  margin-bottom: 20px; transition: 0.3s;
}
.back-btn:hover { color: var(--cyan); }

.filter-box {
  background: var(--glass); border: 1px solid var(--border); border-radius: 20px;
  padding: 22px; margin-bottom: 25px; backdrop-filter: blur(20px);
}
.filter-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 15px; flex-wrap: wrap; gap: 10px;
}
.filter-header h3 { color: var(--cyan); font-size: 1rem; }
.filter-count {
  background: rgba(0,255,231,0.1); border: 1px solid var(--border);
  padding: 6px 15px; border-radius: 50px; font-size: 0.85rem; color: var(--cyan);
}
.filter-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 12px;
}
.filter-group label { display: block; font-size: 0.8rem; color: var(--text-dim); margin-bottom: 6px; font-weight: 600; }
.filter-group input, .filter-group select {
  width: 100%; padding: 11px 14px; background: rgba(0,0,0,0.3);
  border: 1px solid var(--border); border-radius: 10px;
  color: var(--text); font-size: 0.9rem; outline: none; font-family: inherit;
}
.filter-group input:focus, .filter-group select:focus { border-color: var(--cyan); }

.products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
.product-card {
  background: var(--glass); border: 1px solid var(--border); border-radius: 20px;
  overflow: hidden; transition: 0.4s; backdrop-filter: blur(10px);
  position: relative; text-decoration: none; color: inherit;
  display: flex; flex-direction: column;
}
.product-card:hover { transform: translateY(-8px); border-color: var(--cyan); box-shadow: 0 20px 50px rgba(0,255,231,0.3); }
.product-image-wrap { position: relative; height: 200px; overflow: hidden; background: rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; }
.product-image { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
.product-card:hover .product-image { transform: scale(1.1); }
.no-image { font-size: 4rem; opacity: 0.3; }
.product-status {
  position: absolute; top: 12px; right: 12px;
  padding: 6px 12px; border-radius: 50px; font-size: 0.75rem; font-weight: 700;
  backdrop-filter: blur(10px);
}
.status-available { background: rgba(16,185,129,0.9); color: white; }
.status-sold { background: rgba(255,56,96,0.9); color: white; }
.status-unavailable { background: rgba(100,100,100,0.9); color: white; }
.product-code {
  position: absolute; top: 12px; left: 12px;
  background: rgba(0,0,0,0.7); padding: 6px 12px; border-radius: 50px;
  font-size: 0.75rem; color: var(--cyan); backdrop-filter: blur(10px);
  border: 1px solid var(--border);
}
.product-body { padding: 18px; flex: 1; display: flex; flex-direction: column; }
.product-title { font-size: 1rem; margin-bottom: 12px; color: var(--text); font-weight: 700; line-height: 1.4; }
.product-specs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 15px; }
.spec-tag {
  background: rgba(0,255,231,0.08); border: 1px solid var(--border);
  padding: 5px 10px; border-radius: 8px; font-size: 0.72rem; color: var(--cyan);
}
.product-price-box { margin-top: auto; }
.product-price {
  font-size: 1.3rem; font-weight: 900; color: var(--cyan);
  text-shadow: 0 0 20px rgba(0,255,231,0.4);
}
.product-price .currency { font-size: 0.8rem; color: var(--text-dim); font-weight: 500; }
.product-price-usd {
  font-size: 0.85rem; color: var(--purple); font-weight: 700; margin-top: 4px;
}

.empty-state { text-align: center; padding: 80px 20px; color: var(--text-dim); grid-column: 1/-1; }
.empty-state .icon { font-size: 5rem; margin-bottom: 15px; opacity: 0.4; }

.spinner {
  width: 50px; height: 50px; border: 3px solid var(--border);
  border-top-color: var(--cyan); border-radius: 50%;
  animation: spin 1s linear infinite; margin: 0 auto 20px;
}
@keyframes spin { to { transform: rotate(360deg); } }

.float-buttons { position: fixed; bottom: 25px; right: 25px; display: flex; flex-direction: column; gap: 12px; z-index: 999; }
.float-btn {
  width: 55px; height: 55px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  text-decoration: none; font-size: 1.5rem; transition: 0.3s;
  position: relative; cursor: pointer; border: none; color: white;
}
.float-btn::after {
  content: ''; position: absolute; inset: 0; border-radius: 50%;
  border: 2px solid currentColor; animation: ripple 2s ease-out infinite;
}
@keyframes ripple { 0%{transform:scale(1);opacity:0.8;} 100%{transform:scale(1.7);opacity:0;} }
.float-btn.chat { background: linear-gradient(135deg, var(--cyan), var(--purple)); box-shadow: 0 0 25px rgba(0,255,231,0.6); }
.float-btn.phone { background: linear-gradient(135deg, #10b981, #059669); box-shadow: 0 0 25px rgba(16,185,129,0.6); }
.float-btn:hover { transform: scale(1.15) rotate(10deg); }

@media (max-width: 768px) {
  .nav-links { gap: 12px; }
  .nav-links a { font-size: 0.8rem; }
  .products-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
  .product-image-wrap { height: 160px; }
  .product-body { padding: 14px; }
  .product-title { font-size: 0.9rem; }
  .product-price { font-size: 1.1rem; }
  .container { padding: 120px 15px 60px; }
  .float-buttons { bottom: 15px; right: 15px; }
  .float-btn { width: 50px; height: 50px; font-size: 1.3rem; }
}
</style>
</head>
<body>

<div class="bg-glow"></div>

<nav>
  <a href="index.html" class="logo">𝑪𝑨𝑷𝑰𝑻𝑨𝑵..-𝒗𝒆𝒙𝒐𝒓</a>
  <ul class="nav-links">
    <li><a href="index.html">🏠 خانه</a></li>
    <li><a href="category.html?cat=کالاف" data-cat="کالاف">🎯 کالاف</a></li>
    <li><a href="category.html?cat=کلش" data-cat="کلش">🏰 کلش</a></li>
    <li><a href="category.html?cat=آیتم کلش" data-cat="آیتم کلش">💎 آیتم کلش</a></li>
    <li><a href="category.html?cat=آیتم کالاف" data-cat="آیتم کالاف">🔫 آیتم کالاف</a></li>
  </ul>
</nav>

<div class="container">
  <a href="index.html" class="back-btn">→ بازگشت به خانه</a>

  <div class="cat-header">
    <div class="cat-icon" id="catIcon">🎯</div>
    <h1 id="catTitle">دسته‌بندی</h1>
    <p id="catSub">در حال بارگذاری...</p>
  </div>

  <div class="filter-box">
    <div class="filter-header">
      <h3>🔍 فیلتر و جستجو</h3>
      <div class="filter-count" id="resultCount">...</div>
    </div>
    <div class="filter-grid" id="filterGrid">
    </div>
  </div>

  <div class="products-grid" id="productsGrid">
    <div class="empty-state">
      <div class="spinner"></div>
      <p>در حال بارگذاری...</p>
    </div>
  </div>
</div>

<div class="float-buttons">
  <button class="float-btn chat" onclick="openChat()">💬</button>
  <a href="tel:09388499513" id="floatPhone" class="float-btn phone">📞</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>

<script>
const SUPABASE_URL = 'https://pvghoflyhkppgpralypc.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB2Z2hvZmx5aGtwcGdwcmFseXBjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzMjcwODIsImV4cCI6MjEwNTkwMzA4Mn0.yaYfCSXUegLwB3AQDuj733xyCZK49J95W2Gey6EAiWw';

const params = new URLSearchParams(window.location.search);
const category = params.get('cat') || 'کلش';

const categoryInfo = {
  'کالاف': { icon: '🎯', desc: 'اکانت‌های کالاف دیوتی موبایل با رنک‌های مختلف' },
  'کلش': { icon: '🏰', desc: 'اکانت‌های کلش آف کلنز از تاون هال ۱ تا ۱۸' },
  'آیتم کلش': { icon: '💎', desc: 'بلیط طلایی، منظره و آیتم‌های ویژه کلش' },
  'آیتم کالاف': { icon: '🔫', desc: 'آیتم‌ها و اسکین‌های ویژه کالاف دیوتی موبایل' }
};

let allProducts = [];

const info = categoryInfo[category] || { icon: '🎮', desc: 'محصولات این دسته' };
document.getElementById('catIcon').textContent = info.icon;
document.getElementById('catTitle').textContent = category;
document.getElementById('catSub').textContent = info.desc;

document.querySelectorAll('.nav-links a[data-cat]').forEach(a => {
  if (a.dataset.cat === category) a.classList.add('active');
});

function buildFilters() {
  const grid = document.getElementById('filterGrid');
  let html = `
    <div class="filter-group">
      <label>🔍 جستجو</label>
      <input type="text" id="searchInput" placeholder="عنوان یا کد..." oninput="applyFilters()">
    </div>
  `;

  if (category === 'کلش') {
    html += `
      <div class="filter-group">
        <label>🏰 تاون هال</label>
        <select id="filterTH" onchange="applyFilters()">
          <option value="">همه تان‌ها</option>
          <option value="10">تاون هال ۱۰</option>
          <option value="11">تاون هال ۱۱</option>
          <option value="12">تاون هال ۱۲</option>
          <option value="13">تاون هال ۱۳</option>
          <option value="14">تاون هال ۱۴</option>
          <option value="15">تاون هال ۱۵</option>
          <option value="16">تاون هال ۱۶</option>
        </select>
      </div>
    `;
  }

  if (category === 'کالاف') {
    html += `
      <div class="filter-group">
        <label>🎖️ رنک</label>
        <select id="filterRank" onchange="applyFilters()">
          <option value="">همه رنک‌ها</option>
          <option value="Legendary">Legendary</option>
          <option value="Master">Master</option>
          <option value="Grandmaster">Grandmaster</option>
          <option value="Pro">Pro</option>
          <option value="Elite">Elite</option>
        </select>
      </div>
    `;
  }

  if (category.includes('آیتم')) {
    html += `
      <div class="filter-group">
        <label>🏷️ نوع آیتم</label>
        <input type="text" id="filterItemType" placeholder="مثلاً: بلیط" oninput="applyFilters()">
      </div>
    `;
  }

  html += `
    <div class="filter-group">
      <label>💰 از قیمت (تومان)</label>
      <input type="number" id="minPrice" placeholder="مثلاً 1000000" oninput="applyFilters()">
    </div>
    <div class="filter-group">
      <label>💰 تا قیمت (تومان)</label>
      <input type="number" id="maxPrice" placeholder="مثلاً 5000000" oninput="applyFilters()">
    </div>
  `;

  grid.innerHTML = html;
}

buildFilters();

async function loadProducts() {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/products?category=eq.${encodeURIComponent(category)}&select=*&order=id.desc`, {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
    });
    const data = await res.json();
    allProducts = Array.isArray(data) ? data : [];
    applyFilters();
  } catch (err) {
    console.error(err);
    document.getElementById('productsGrid').innerHTML = `
      <div class="empty-state">
        <div class="icon">😕</div>
        <p>خطا در بارگذاری</p>
      </div>
    `;
  }
}

function applyFilters() {
  const search = (document.getElementById('searchInput')?.value || '').trim().toLowerCase();
  const filterTH = document.getElementById('filterTH')?.value || '';
  const filterRank = document.getElementById('filterRank')?.value || '';
  const filterItemType = (document.getElementById('filterItemType')?.value || '').trim().toLowerCase();
  const minPrice = parseInt(document.getElementById('minPrice')?.value) || 0;
  const maxPrice = parseInt(document.getElementById('maxPrice')?.value) || Infinity;

  const filtered = allProducts.filter(p => {
    if (search) {
      const title = (p.title || '').toLowerCase();
      const code = (p.account_code || '').toLowerCase();
      if (!title.includes(search) && !code.includes(search)) return false;
    }
    if (filterTH && p.town_hall != filterTH) return false;
    if (filterRank && (p.rank || '').toLowerCase() !== filterRank.toLowerCase()) return false;
    if (filterItemType && !(p.item_type || '').toLowerCase().includes(filterItemType)) return false;
    if (p.price && p.price < minPrice) return false;
    if (p.price && p.price > maxPrice) return false;
    return true;
  });

  renderProducts(filtered);
  document.getElementById('resultCount').textContent = `${filtered.length} مورد پیدا شد`;
}

function renderProducts(products) {
  const grid = document.getElementById('productsGrid');
  if (!products || products.length === 0) {
    grid.innerHTML = `
      <div class="empty-state">
        <div class="icon">📦</div>
        <p>هیچ محصولی توی این دسته نیست</p>
        <p style="font-size:0.85rem;margin-top:10px;color:#666;">از پنل مدیریت محصول اضافه کن</p>
      </div>
    `;
    return;
  }

  grid.innerHTML = products.map(p => {
    const img = (p.images && p.images[0]) ? p.images[0] : '';
    const statusClass = p.status === 'موجود' ? 'status-available' : (p.status === 'فروش رفته' ? 'status-sold' : 'status-unavailable');
    const priceFmt = p.price ? Number(p.price).toLocaleString('fa-IR') : 'تماس';

    let specs = '';
    if (p.category === 'کلش') {
      if (p.town_hall) specs += `<span class="spec-tag">🏰 تان ${p.town_hall}</span>`;
      if (p.builder_level) specs += `<span class="spec-tag">🏗️ بیلدر ${p.builder_level}</span>`;
      if (p.name_changes) specs += `<span class="spec-tag">✏️ ${p.name_changes} تغییر نام</span>`;
    } else if (p.category === 'کالاف') {
      if (p.rank) specs += `<span class="spec-tag">🎖️ ${p.rank}</span>`;
      if (p.player_level) specs += `<span class="spec-tag">📊 لول ${p.player_level}</span>`;
      if (p.skins_count) specs += `<span class="spec-tag">🎨 ${p.skins_count} اسکین</span>`;
    } else if (p.category && p.category.includes('آیتم')) {
      if (p.item_type) specs += `<span class="spec-tag">🏷️ ${p.item_type}</span>`;
      if (p.item_amount) specs += `<span class="spec-tag">📦 ${p.item_amount}</span>`;
    }

    return `
      <a href="product.html?id=${p.id}" class="product-card">
        <div class="product-image-wrap">
          ${img ? `<img src="${img}" class="product-image" alt="${p.title}" loading="lazy" onerror="this.style.display='none';this.parentNode.innerHTML='<div class=\\'no-image\\'>🎯</div>'">` : '<div class="no-image">🎯</div>'}
          <div class="product-status ${statusClass}">${p.status || 'موجود'}</div>
          ${p.account_code ? `<div class="product-code">کد: ${p.account_code}</div>` : ''}
        </div>
        <div class="product-body">
          <h3 class="product-title">${p.title || 'بدون عنوان'}</h3>
          <div class="product-specs">${specs}</div>
          <div class="product-price-box">
            <div class="product-price">
              ${priceFmt}
              ${p.price ? '<span class="currency">تومان</span>' : ''}
            </div>
            ${p.price_usd ? `<div class="product-price-usd">💵 ${p.price_usd}</div>` : ''}
          </div>
        </div>
      </a>
    `;
  }).join('');
}

async function loadContact() {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/shop_settings?id=eq.1&select=*`, {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
    });
    const data = await res.json();
    if (data && data.length > 0) {
      document.getElementById('floatPhone').href = `tel:${data[0].phone}`;
    }
  } catch (err) { console.error(err); }
}

function openChat() {
  window.location.href = 'index.html#chat';
}

loadProducts();
loadContact();

// ===== PWA Service Worker =====
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js')
      .then((reg) => console.log('✅ PWA registered!'))
      .catch((err) => console.log('❌ PWA error:', err));
  });
}
</script>

</body>
</html>
